# Homelab deployment: private openGym (passkeys, full API) + a public-only MCP/OAuth edge.
#
#   mkdir -p data secrets certs && openssl rand -hex 32 > secrets/mcp_service_token
#   sudo chown 1000:1000 data secrets/mcp_service_token && chmod 0400 secrets/mcp_service_token
#   cp .env.homelab.example .env   # then edit
#   docker compose -f docker-compose.homelab.yml up -d --build
#
# Networks: nothing public reaches api or web. `internal` has no route out; only api sits on
# `egress` (web push needs it). mcp has no egress and never mounts ./data.
x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  api:
    <<: *hardening
    build: { context: ./api, target: homelab }
    user: "1000:1000"
    environment:
      PORT: "3000"
      DATA_DIR: /data
      RP_ID: ${PRIVATE_HOST:?set PRIVATE_HOST}
      ORIGIN: https://${PRIVATE_HOST}:${PRIVATE_PORT:-8443}
      TRUST_PROXY: "1"
      MCP_SERVICE_TOKEN_FILE: /run/secrets/mcp_service_token
      MCP_INTERNAL_URL: http://mcp:3002
      FIRST_USER_ADMIN: ${FIRST_USER_ADMIN:-0}
      INVITE_ONLY: ${INVITE_ONLY:-0}
      COACH_DISABLED: "1"
    volumes: ["./data:/data"]
    tmpfs: ["/tmp"]
    secrets: [mcp_service_token]
    networks: [internal, egress]

  web:
    <<: *hardening
    build: { context: ., dockerfile: web/Dockerfile, target: homelab }
    user: "101:101"
    environment: { BACKEND: api, PORT: "3000", NGINX_PORT: "8080" }
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    tmpfs: ["/tmp", "/etc/nginx/conf.d:uid=101,gid=101"]
    depends_on: [api]
    networks: [internal, private_web]

  mcp:
    <<: *hardening
    build: { context: ., dockerfile: mcp/Dockerfile }
    user: "1000:1000"
    environment:
      PORT: "3001"
      INTERNAL_PORT: "3002"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL}
      API_INTERNAL_URL: http://api:3000
      MCP_SERVICE_TOKEN_FILE: /run/secrets/mcp_service_token
      MCP_STATE_DIR: /state
      ALLOWED_REDIRECT_HOSTS: ${ALLOWED_REDIRECT_HOSTS:-}
      TRUST_PROXY_HOPS: "1"
    volumes: ["mcp-state:/state"]
    tmpfs: ["/tmp"]
    secrets: [mcp_service_token]
    depends_on: [api]
    networks: [internal, public_mcp]

  caddy-public:
    <<: *hardening
    build: { context: ./caddy }
    image: opengym-caddy:local
    user: "1000:1000"
    # Funnel (TLS) forwards to this loopback port; plain HTTP here.
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:8080"]
    volumes: ["./Caddyfile.public:/etc/caddy/Caddyfile:ro"]
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    depends_on: [mcp]
    networks: [public_edge, public_mcp]

  caddy-private:
    <<: *hardening
    build: { context: ./caddy }
    image: opengym-caddy:local
    user: "1000:1000"
    environment: { PRIVATE_HOST: "${PRIVATE_HOST}" }
    # Bind to the LAN/WireGuard address only, never 0.0.0.0.
    ports: ["${PRIVATE_BIND_IP:?set PRIVATE_BIND_IP}:${PRIVATE_PORT:-8443}:8443"]
    volumes:
      - ./Caddyfile.private:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    tmpfs: ["/data:uid=1000,gid=1000", "/config:uid=1000,gid=1000"]
    depends_on: [web]
    networks: [private_edge, private_web]

networks:
  public_edge: {}               # published to loopback for the public tunnel
  private_edge: {}              # published to the private interface
  public_mcp: { internal: true }   # caddy-public <-> mcp only
  private_web: { internal: true }  # caddy-private <-> web only
  internal: { internal: true }     # web, api, mcp
  egress: {}                       # api only (web push)

volumes:
  mcp-state: {}

secrets:
  mcp_service_token:
    file: ./secrets/mcp_service_token
