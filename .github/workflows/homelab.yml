# Homelab fork: test everything, then build and push the three images tagged with the commit SHA.
# No :latest is ever published; the digests are printed so deployments can pin them.
name: homelab

on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          node scripts/check-locales.mjs
          node scripts/check-source-strings.mjs --strict
      - name: API
        working-directory: api
        run: |
          npm ci --omit=optional
          npm test
      - name: MCP
        working-directory: mcp
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check:node-loadable

  images:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        id: api
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          target: homelab
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ env.OWNER }}/opengym-api:${{ github.sha }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: web/Dockerfile
          target: homelab
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ env.OWNER }}/opengym-web:${{ github.sha }}

      - name: Build and push mcp
        id: mcp
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ env.OWNER }}/opengym-mcp:${{ github.sha }}

      - name: Print image digests
        env:
          API: ${{ steps.api.outputs.digest }}
          WEB: ${{ steps.web.outputs.digest }}
          MCP: ${{ steps.mcp.outputs.digest }}
        run: |
          {
            echo "### Image digests"
            echo "- ghcr.io/${OWNER}/opengym-api@${API}"
            echo "- ghcr.io/${OWNER}/opengym-web@${WEB}"
            echo "- ghcr.io/${OWNER}/opengym-mcp@${MCP}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
